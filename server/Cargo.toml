[package]
name = "server"
version = "0.1.0"
edition = "2024"

[features]
default = ["chinese", "japanese"]
chinese = ["engine/chinese"]
japanese = ["engine/japanese"]

[dependencies]
axum = "0.8"
base64 = "0.22.1"
crc32fast = "1"
engine = { version = "0.1.0", path = "../engine", default-features = false }
form_urlencoded = "1"
hmac = "0.12.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.10.8"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
