[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[features]
default = ["chinese", "japanese"]
# Dictionary word segmentation; without it each character is a word.
chinese = ["dep:jieba-rs"]
# Japanese with Lindera and an embedded IPADIC dictionary (about 50 MB),
# downloaded from lindera.dev when the engine is first built.
japanese = ["dep:lindera"]

[dependencies]
bincode = "1.3"
jieba-rs = { version = "0.11.0", optional = true }
lindera = { version = "6.2.0", features = ["embed-ipadic"], optional = true }
roaring = { version = "0.10", features = ["serde"] }
rustc-hash = "2"
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = "0.1"

